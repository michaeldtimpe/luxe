[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "luxe"
version = "1.6.1"
description = "luxe — MLX-only repo maintainer (mono-only; SpecDD Lever 2)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "rich>=13.0",
    "click>=8.0",
    # >=1.28.1 closes PYSEC-2026-3483. Held below 2.0 deliberately: mcp 2.0
    # is a major bump touching the client API that src/luxe/mcp/client.py
    # drives the fleet relays with, and this pin buys the security fix
    # without that risk. Lifting it is its own change, with a real relay
    # drill (luxe-alpha / luxe-kappa) as the gate.
    "mcp>=1.28.1,<2",
    "rank_bm25>=0.2.2",
    "tree-sitter>=0.20",
    "tree-sitter-language-pack>=0.13,<1.0",
]

[project.optional-dependencies]
# mpmath is [bfcl]'s dep, repeated here on purpose: the vendored BFCL MathAPI
# tool-class imports it, so `tests/test_bfcl_multi_turn.py` needs it wherever the
# multi_turn data is vendored. The canonical host sync (`uv sync --extra chat
# --extra dev --extra analyzers --extra web`, cli.py) does NOT pass `--extra bfcl`,
# so without this pin every sync pruned mpmath and reddened test_miss_func_49 —
# a recurring false alarm (lessons.md 2026-06-03).
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "mpmath>=1.3"]
# The static-analysis toolchain the `lint`/`typecheck`/`security_scan`/`deps_audit`
# tools shell out to. Install (`pip install -e '.[analyzers]'`) so a fresh box
# isn't missing them — the M1 iteration-2 run had no ruff and silently skipped
# linting. The tools also resolve these via `python -m`/`uvx` when present.
analyzers = ["ruff>=0.4", "mypy>=1.8", "bandit>=1.7", "pip-audit>=2.7"]
# Required to run the vendored BFCL multi_turn evaluator (MathAPI uses mpmath).
# Do NOT add bfcl_eval here — it pins tree_sitter==0.21.3 and breaks symbols.py
# (the multi_turn eval is vendored under benchmarks/bfcl/multi_turn/ instead).
bfcl = ["mpmath>=1.3"]
# Extended-benchmark suite (MMLU / ARC-Challenge / GSM8K / CodeNeedle /
# Perplexity). esprima parses JS for the codeneedle needle-extractor;
# mlx_lm loads model weights in-process for logprob-based scoring
# (oMLX drops logprobs); datasets fetches MMLU/ARC/GSM8K/WikiText.
extended-bench = [
    "esprima>=4.0",
    "mlx_lm>=0.31",
    "datasets>=2.0",
]
# Interactive `luxe chat`. textual drives the full-screen TUI (scrollable
# transcript + bottom status bar + input); prompt_toolkit remains the line-editor
# fallback for non-TTY / textual-absent installs (degrades further to input()).
# Not base deps so benchmark/headless installs stay lean.
chat = ["prompt_toolkit>=3.0", "textual>=0.74,<2.0"]
# Headless-browser rendering for the chat-only `/web` tools (render=true).
# NOT a base dep and not in [chat]: the Chromium binary is a further
# ~150-400 MB `playwright install chromium`, and the fallback kit must stay
# installable on every fleet host without it. Plain web_fetch (httpx +
# stdlib extraction) works with none of this; only JS-rendered pages need it.
web = ["playwright>=1.40"]
# The opt-in PDF capability module (`src/luxe/mcp_pdf/`, server `luxe-pdf-mcp`).
# NOT a base dep and not in [chat]: the module is only reachable when a chat
# session attaches it with `--mcp`, and the benchmark path must never grow a
# dependency on PDF libraries or local print queues. The CLI half (qpdf,
# poppler's pdftotext/pdftoppm, CUPS lp) is not pip-installable — the tools
# name the `brew install` when one is missing.
pdf = ["pypdf>=5.0", "reportlab>=4.0", "pillow>=10.0"]

[project.scripts]
luxe = "luxe.cli:main"
luxe-pdf-mcp = "luxe.mcp_pdf.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/luxe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live_model: requires the 35B model loaded in-process via mlx_lm (skip by default; run manually after stopping oMLX)",
    "live_backend: requires a running oMLX HTTP server (skip by default in CI)",
]
# The markers above promise "skip by default"; this is what implements it.
# Without it the live_model tests ran on every invocation — loading real MLX
# weights (~17% of the suite wall) and hard-erroring on any box without
# Apple-silicon MLX, i.e. every Linux CI runner. A `-m` passed on the command
# line overrides this one, so the documented manual invocation
# (`pytest tests/test_mlx_direct_smoke.py -m live_model`) still works.
# Pinned by tests/test_marker_policy.py.
addopts = "-m 'not live_model and not live_backend'"
