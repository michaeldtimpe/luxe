omlx_base_url: "http://127.0.0.1:8000"

# Named oMLX endpoints for `luxe chat` (`/backend` to switch, `--backend` at
# startup). CHAT-ONLY: benchmark/maintain keep reading omlx_base_url above.
# API keys never live here — api_key_env names the env var resolved at Backend
# construction (falls back to OMLX_API_KEY). m5's timeout_s is large because
# dense 16384-tok turns over the Tailscale link can run ~25 min; 600s
# read-timeouts left dead-request hangs.
backends:
  local:
    base_url: "http://127.0.0.1:8000"
    default: true
  m5:
    base_url: "http://m5.tailca7308.ts.net:8000"
    api_key_env: OMLX_API_KEY_M5
    timeout_s: 2400

# Chat color palette (D2): the default is 'auto' — it tracks your ACTIVE
# terminal/YASL statusline theme. Resolved as `--theme` flag → LUXE_THEME env →
# 'auto'. The curated luxe palettes are opt-in: `--theme cool|warm|mono` (or
# LUXE_THEME=cool). (Default lives in cli.py:chat_cmd, not a parsed key here.)

profile:
  name: "Interactive chat"
  description: "luxe chat/code REPL — the host manifest's main drives every slot."
  memory_budget_gb: 48
  peak_model_gb: 30.0

# Per-host model manifests (2026-07-30 fallback-kit pivot): each fleet host
# declares its interactive main + fallback pair, keyed by short hostname.
# `main` drives every slot by default; `fallback` is what the session
# auto-degrades to — loudly — when main can't be served or fails to load
# (the deleted-champion-weights incident is the motivating failure).
# All listed models (incl. `keep`) are expected LOCALLY CACHED on that host:
# `luxe pull` provisions them, `/doctor` + `luxe smoke` verify them,
# `luxe pull --remove` refuses them. Chat-only; benchmark/maintain never
# read this block. neo (8 GB) is deliberately absent — it doesn't hunt.
hosts:
  m5:                                  # M5 Max, 128 GB
    main: "Qwen3.6-35B-A3B-6bit"
    fallback: "Qwen3.6-27B-6bit"
  m1:                                  # M1 Max MBP, 64 GB (36 GB wired cap)
    main: "Qwen3.6-27B-4bit"
    fallback: "Qwen3.6-35B-A3B-4bit"
    keep:
      # Benchmark champion (single_64gb.yaml) — bench exception, kept on
      # disk so the maintain/bench path stays runnable. Not a chat default.
      - "Qwen3.6-35B-A3B-6bit"
  m4:                                  # M4 Pro MBP, 48 GB
    main: "Qwen3.6-27B-4bit"
    fallback: "Qwen3.6-35B-A3B-4bit"

# Chat-only roster: the ONLY models `/model` offers and slots may resolve to
# (this host's manifest models are always allowed on top). gemma dropped
# 2026-07-30 — no tool support (template roles are system/user/assistant only;
# oMLX silently drops the `tools` array), and the fallback kit has no seat for
# a conversation-only model. Empty list = show everything the server reports.
# Benchmark/maintain ignore this key.
visible_models:
  - Qwen3.6-35B-A3B-6bit              # bench champion · m5 main
  - Qwen3.6-27B-6bit                  # m5 fallback
  - Qwen3.6-27B-4bit                  # m1/m4 main
  - Qwen3.6-35B-A3B-4bit              # m1/m4 fallback

models:
  # The pinned benchmark champion (single_64gb.yaml); also the m5 chat main.
  # Slots fall back to the host manifest's `main` first, then to this.
  monolith: "Qwen3.6-35B-A3B-6bit"
  # Named handles for /model and ad-hoc slot pointing.
  dense_27b: "Qwen3.6-27B-6bit"
  dense_27b_4bit: "Qwen3.6-27B-4bit"
  moe_4bit: "Qwen3.6-35B-A3B-4bit"

roles:
  monolith:
    model_key: monolith
    num_ctx: 32768
    # Hard ceiling for the interactive `/ctx` size flag (chat-only). 262144 is
    # the 256K `huge` tier (C4) — reachable but NOT the default (num_ctx stays
    # 32768). 128K (xlarge) is BFCL-proven; 256K is opt-in via `/ctx huge` and
    # should be load-tested (RAM/KV + gen latency scale with the window). Lower
    # this on a smaller-RAM machine (e.g. neo pins num_ctx: 8192 and omits this →
    # /ctx stays capped at 8192). The benchmark/maintain path never reads it.
    num_ctx_max: 262144
    max_steps: 30
    max_tokens_per_turn: 8192
    temperature: 0.0
    task_overlay_id: manage_strict_only
    tools:
      - read_file
      - list_dir
      - glob
      - grep
      - bm25_search
      - find_symbol
      - write_file
      - edit_file
      - git_diff
      - git_log
      - git_show
      - bash
      - lint
      - typecheck
      - security_scan
      - deps_audit
      - cve_lookup

task_types:
  review:
    description: "Code review — single-model agentic loop"
    pipeline: [monolith]
  implement:
    description: "Feature implementation — single-model agentic loop"
    pipeline: [monolith]
  bugfix:
    description: "Bug investigation and fix — single-model agentic loop"
    pipeline: [monolith]
  document:
    description: "Documentation generation — single-model agentic loop"
    pipeline: [monolith]
  summarize:
    description: "Codebase summarization — single-model agentic loop"
    pipeline: [monolith]
  manage:
    description: "Repository management — single-model agentic loop"
    pipeline: [monolith]

# Opt-in model fan-out for the chat front-end. OMITTED here => every slot
# resolves to the champion (no fan-out; byte-identical to single_64gb.yaml's
# model selection). Uncomment and point a slot at another `models:` entry to
# experiment. This is the sole sanctioned per-work-type model selection
# (see luxe.sdd). RAM note: two weight-sets can't coexist in oMLX, so distinct
# slot models incur a sequential weight swap when a turn routes to them.
#
# slots:
#   chat: {model_key: monolith}
#   plan: {model_key: monolith}
#   code: {model_key: coder_30b}
