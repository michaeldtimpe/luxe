omlx_base_url: "http://127.0.0.1:8000"

# Named oMLX endpoints for `luxe chat` (`/backend` to switch, `--backend` at
# startup). CHAT-ONLY: benchmark/maintain keep reading omlx_base_url above.
# API keys never live here — api_key_env names the env var resolved at Backend
# construction (falls back to OMLX_API_KEY). m5's timeout_s is large because
# dense 16384-tok turns over the Tailscale link can run ~25 min; 600s
# read-timeouts left dead-request hangs.
backends:
  local:
    base_url: "http://127.0.0.1:8000"
    default: true
  m5:
    base_url: "http://m5.tailca7308.ts.net:8000"
    api_key_env: OMLX_API_KEY_M5
    timeout_s: 2400
    # Progress deadline (B6), raised to match timeout_s. A dense 16384-tok
    # turn here prefills for ~25 min (~1500s) emitting only keepalives, which
    # leaves just 300s of headroom under Backend's 1800s default — too close
    # for a link that also absorbs Tailscale hiccups. decode_stall_timeout_s
    # stays at the default: once tokens flow they arrive sub-second, so 120s
    # is already ~100x headroom and a longer gap means the turn is dead.
    stall_timeout_s: 2400
    # `shared` is auto-detected from base_url — anything non-loopback counts,
    # so this fleet endpoint is shared without needing the key. That turns OFF
    # single-residency eviction here: luxe frees only the models THIS session
    # loaded, never another host's (B5). Set `shared: false` if m5 ever becomes
    # dedicated and you want the RAM reclaimed aggressively again.
  # CLOUD carve-out (2026-08-17, luxe.sdd + chat.sdd): metered, opt-in per
  # session (`luxe chat --backend openrouter` / `/backend openrouter`), never a
  # slot default, never a host-manifest main/fallback, never a bench target.
  # base_url stops at /api because the client appends /v1/chat/completions.
  openrouter:
    base_url: "https://openrouter.ai/api"
    engine: openrouter
    # As always, the NAME of the env var — never the key. Resolved through
    # luxe.secrets (env → ~/.luxe/secrets.env → Keychain).
    api_key_env: OPENROUTER_API_KEY
    # Cloud round-trips are minutes at worst, not the ~25min dense prefill m5
    # can take; the stock 600s read timeout and progress deadlines apply.
    # HARD session spend cap. The session refuses a turn BEFORE dispatching it
    # once accumulated cost reaches this; `/usage budget <usd>` raises it for
    # the session only. Remove the key to run uncapped (and unwatched).
    budget_usd: 5.00
    # What makes per-request cost come back: OpenRouter only fills
    # `usage.cost` when the body asks for it. Merged at the TOP LEVEL of the
    # chat body (never `extra_body` — see backend.py 2026-08-11).
    body_extras:
      usage: {include: true}
    # Kimi K3 is a REASONING model and every reasoning token is billed: a
    # one-sentence question measured 255 chars of answer against 3,568 chars
    # of reasoning, 792 completion tokens (2026-08-17). Interactive chat pays
    # that in latency AND money, so ask for the cheap tier by default;
    # `/reasoning high` buys the depth back for a session that needs it.
    reasoning_effort: low
    # PER-BACKEND roster: the global `visible_models:` below names local MLX
    # weights, and intersecting it with a ~300-model cloud catalog would leave
    # `/model` empty. This is the shortlist; `/model find <text>` searches the
    # live catalog and `/model all <exact-id>` pins anything in it.
    visible_models:
      - moonshotai/kimi-k3
    # What every unpinned slot resolves to while this backend is active. Slot
    # defaults otherwise come from this host's manifest — LOCAL weight ids —
    # which OpenRouter does not serve, so a session opening here would sit
    # pointed at a model the provider has never heard of. Yields to `/model`
    # and to the `--chat/plan/code-model` startup flags.
    default_model: moonshotai/kimi-k3

# Chat color palette (D2): the default is 'auto' — it tracks your ACTIVE
# terminal/YASL statusline theme. Resolved as `--theme` flag → LUXE_THEME env →
# 'auto'. The curated luxe palettes are opt-in: `--theme cool|warm|mono` (or
# LUXE_THEME=cool). (Default lives in cli.py:chat_cmd, not a parsed key here.)

profile:
  name: "Interactive chat"
  description: "luxe chat/code REPL — the host manifest's main drives every slot."
  memory_budget_gb: 48
  peak_model_gb: 30.0

# Session working notes (chat-only): when a session with a project attached
# ends, distil 3-6 bullets of what was done / what failed / what's open into
# the `luxe:notes` block of <repo>/.luxe/memory.md, so the NEXT session in
# that repo starts knowing. Rolling window of 5 entries; one extra model call
# per session, at the end. `/note` banks them on demand regardless of this
# setting. Set false to turn the automatic write off.
notes: true

# Per-host model manifests (2026-07-30 fallback-kit pivot): each fleet host
# declares its interactive main + fallback pair, keyed by short hostname.
# `main` drives every slot by default; `fallback` is what the session
# auto-degrades to — loudly — when main can't be served or fails to load
# (the deleted-champion-weights incident is the motivating failure).
# All listed models (incl. `keep`) are expected LOCALLY CACHED on that host:
# `luxe pull` provisions them, `/doctor` + `luxe smoke` verify them,
# `luxe pull --remove` refuses them. Chat-only; benchmark/maintain never
# read this block. neo (8 GB) is deliberately absent — it doesn't hunt.
hosts:
  m5:                                  # M5 Max, 128 GB
    main: "Qwen3.6-35B-A3B-6bit"
    fallback: "Qwen3.6-27B-6bit"
    keep:
      # Capacity experiment (2026-08-03): bake-off-validated big MoE for
      # turns where depth beats speed. Opt-in per session via /model —
      # never a main/fallback, never routed to by default.
      - "GLM-4.5-Air-4bit"
    ctx_max:
      # Native window cap (GLM-4.5-Air is a 128K model; the monolith role's
      # 262144 /ctx ceiling would overshoot it). Not a RAM cap — 4bit weights
      # are ~60 GB, leaving ample KV headroom on 128 GB.
      "GLM-4.5-Air-4bit": 131072
  # Small hosts run the MoE as main (flipped 2026-07-30 after real-turn data:
  # Qwen3.6 is a multimodal family, so oMLX routes it to the slow vlm engine —
  # the dense 27B prefills at ~65 tok/s with no cache reuse (63-74s chat
  # turns), while the MoE's ~3B active params keep turns ~10s. The dense stays
  # as the quality fallback; revisit if oMLX's vlm text path gets fast.)
  m1:                                  # M1 Max MBP, 64 GB (36 GB wired cap)
    main: "Qwen3.6-35B-A3B-4bit"
    fallback: "Qwen3.6-27B-4bit"
    keep:
      # Benchmark champion (single_64gb.yaml) — bench exception, kept on
      # disk so the maintain/bench path stays runnable. Not a chat default.
      - "Qwen3.6-35B-A3B-6bit"
    # Per-model /ctx ceilings (2026-07-30 KV audit; fp16 KV, no quant).
    # MoE-4bit: 20 KB/tok → 256K KV = 5 GiB in ~17 GiB headroom → uncapped.
    # dense-4bit: 64 KB/tok → 256K = 16 GiB of ~21 GiB headroom (no margin),
    #   and its ~65 tok/s vlm-engine prefill makes >32K turns take tens of
    #   minutes anyway — capped at the 32K default.
    # champion-6bit: 28.4 GiB weights leave ~7.6 GiB → 128K (2.5 GiB KV) max.
    ctx_max:
      "Qwen3.6-27B-4bit": 32768
      "Qwen3.6-35B-A3B-6bit": 131072
  m4:                                  # M4 Pro MBP, 48 GB
    main: "Qwen3.6-35B-A3B-4bit"
    fallback: "Qwen3.6-27B-4bit"
    # Same dense-27B story as m1, on a smaller box.
    ctx_max:
      "Qwen3.6-27B-4bit": 32768

# Chat-only roster: the ONLY models `/model` offers and slots may resolve to
# (this host's manifest models are always allowed on top). gemma dropped
# 2026-07-30 — no tool support (template roles are system/user/assistant only;
# oMLX silently drops the `tools` array), and the fallback kit has no seat for
# a conversation-only model. Empty list = show everything the server reports.
# Benchmark/maintain ignore this key.
visible_models:
  - Qwen3.6-35B-A3B-6bit              # bench champion · m5 main
  - Qwen3.6-27B-6bit                  # m5 fallback
  - Qwen3.6-35B-A3B-4bit              # m1/m4 main (MoE — fast on vlm engine)
  - Qwen3.6-27B-4bit                  # m1/m4 fallback (dense — slow prefill)
  # Capacity model (2026-08-03): 106B-A12B MoE, 10/10 on the m5max_moe
  # bake-off gate. m5-only weights (~60 GB) — the roster is intersected with
  # each host's server catalog, so m1/m4 never offer it. Pin per session:
  # `/model chat GLM-4.5-Air-4bit` (or plan|code) when depth beats speed.
  - GLM-4.5-Air-4bit

models:
  # The pinned benchmark champion (single_64gb.yaml); also the m5 chat main.
  # Slots fall back to the host manifest's `main` first, then to this.
  monolith: "Qwen3.6-35B-A3B-6bit"
  # Named handles for /model and ad-hoc slot pointing.
  dense_27b: "Qwen3.6-27B-6bit"
  dense_27b_4bit: "Qwen3.6-27B-4bit"
  moe_4bit: "Qwen3.6-35B-A3B-4bit"
  # m5-only capacity model (see visible_models note). A handle for ad-hoc
  # slot pointing; deliberately NOT wired into `slots:` — that block is
  # fleet-shared and m1/m4 can't hold 60 GB of weights.
  glm_air: "GLM-4.5-Air-4bit"

roles:
  monolith:
    model_key: monolith
    num_ctx: 32768
    # Hard ceiling for the interactive `/ctx` size flag (chat-only). 262144 is
    # the 256K `huge` tier (C4) — reachable but NOT the default (num_ctx stays
    # 32768). 128K (xlarge) is BFCL-proven; 256K is opt-in via `/ctx huge` and
    # should be load-tested (RAM/KV + gen latency scale with the window). Lower
    # this on a smaller-RAM machine (e.g. neo pins num_ctx: 8192 and omits this →
    # /ctx stays capped at 8192). The benchmark/maintain path never reads it.
    num_ctx_max: 262144
    max_steps: 30
    max_tokens_per_turn: 8192
    temperature: 0.0
    task_overlay_id: manage_strict_only
    tools:
      - read_file
      - list_dir
      - glob
      - grep
      - bm25_search
      - find_symbol
      - write_file
      - edit_file
      - git_diff
      - git_log
      - git_show
      - bash
      - lint
      - typecheck
      - security_scan
      - deps_audit
      - cve_lookup

task_types:
  review:
    description: "Code review — single-model agentic loop"
    pipeline: [monolith]
  implement:
    description: "Feature implementation — single-model agentic loop"
    pipeline: [monolith]
  bugfix:
    description: "Bug investigation and fix — single-model agentic loop"
    pipeline: [monolith]
  document:
    description: "Documentation generation — single-model agentic loop"
    pipeline: [monolith]
  summarize:
    description: "Codebase summarization — single-model agentic loop"
    pipeline: [monolith]
  manage:
    description: "Repository management — single-model agentic loop"
    pipeline: [monolith]

# Opt-in model fan-out for the chat front-end. OMITTED here => every slot
# resolves to the champion (no fan-out; byte-identical to single_64gb.yaml's
# model selection). Uncomment and point a slot at another `models:` entry to
# experiment. This is the sole sanctioned per-work-type model selection
# (see luxe.sdd). RAM note: two weight-sets can't coexist in oMLX, so distinct
# slot models incur a sequential weight swap when a turn routes to them.
#
# slots:
#   chat: {model_key: monolith}
#   plan: {model_key: monolith}
#   code: {model_key: coder_30b}
