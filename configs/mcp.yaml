# MCP — Model Context Protocol — client + server config.
#
# Default ships with NO client servers configured. Add servers under
# `client.servers` to opt in. The server-side block governs `luxe serve`
# (Phase 6) and is documented here for reference.
#
# Each client server has its own per-call timeout and per-session call cap;
# the global circuit breaker trips after `consecutive_failures` failed calls
# from one server.

client:
  servers: []
  # Example (commented):
  # - name: github
  #   transport: stdio
  #   command: npx
  #   args: ["-y", "@modelcontextprotocol/server-github"]
  #   env:
  #     GITHUB_TOKEN: "${GITHUB_TOKEN}"
  #   timeout_s: 30
  #   enabled_for: [maintain, review]
  #   max_calls_per_session: 50
  # - name: filesystem
  #   transport: stdio
  #   command: npx
  #   args: ["-y", "@modelcontextprotocol/server-filesystem", "/safe/path"]
  #   timeout_s: 30
  #   enabled_for: [maintain]
  #   max_calls_per_session: 50
  # - name: git                       # richer git than the native git_diff/log/show
  #   transport: stdio                 # tools are auto-namespaced mcp__git__<tool>
  #   command: uvx
  #   args: ["mcp-server-git", "--repository", "."]
  #   timeout_s: 30
  #   enabled_for: [chat, maintain, review]
  #   max_calls_per_session: 50
  # - name: pdf                        # the in-repo PDF module (src/luxe/mcp_pdf/)
  #   transport: stdio                 # install first: uv sync --extra pdf
  #   command: ~/Downloads/luxe/.venv/bin/luxe-pdf-mcp   # `~` expands per host
  #   timeout_s: 120                   # rasterising a long PDF is not instant
  #   max_calls_per_session: 100
  #   gate_tools:                      # everything that writes a file or prints
  #     - pdf_unlock
  #     - pdf_fill
  #     - pdf_overlay
  #     - pdf_print
  #     - pdf_merge
  #     - pdf_split
  #     - pdf_rotate
  #     - pdf_to_images
  #     - images_to_pdf
  # - name: ops                        # remote MCP endpoint (chat: `luxe chat --mcp ops`)
  #   transport: streamable_http
  #   url: "https://example.internal/mcp"
  #   api_key_env: OPS_MCP_TOKEN       # resolved env → ~/.luxe/secrets.env → keychain;
  #                                    # sent as `Authorization: Bearer <value>`.
  #                                    # NEVER put the value itself in YAML.
  #   headers: {}                      # extra headers; values may use ${VAR}
  #   gate_tools: ["run", "restart_*"] # mutating tools — /write-gated in chat
  #   only_tools: []                   # fnmatch allowlist; empty = all tools
  #   timeout_s: 60
  #   max_calls_per_session: 50

  circuit_breaker:
    consecutive_failures: 3
    hard_cap_calls: 200

# Server side (luxe serve) — Phase 6 will consume this.
server:
  read_only_tools:
    - luxe_review
    - luxe_summarize
    - luxe_explain
  mutation_tools:
    - luxe_maintain
  rate_limits:
    luxe_maintain: "1/min"
    luxe_review: "6/min"
    luxe_summarize: "6/min"
    luxe_explain: "6/min"
