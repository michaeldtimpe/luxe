name: luxe-tests

# The repo root IS luxe. This workflow used to carry `paths: luxe/**` and
# `working-directory: luxe`, left over from when luxe was a subdirectory of a
# larger monorepo. After the 2026-04-29 extraction that combination meant
# branch and PR pushes never triggered at all, while tag pushes (GitHub does
# not evaluate `paths` filters for tags) triggered and died in ~10s on a
# missing working directory. Do not reintroduce either.
on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # uv itself is pinned too: `latest` let a uv release change resolution
      # or lockfile handling under a green PR with no commit to blame. Bump it
      # deliberately (fleet hosts run the brew uv; 0.13.4 as of 2026-10-22).
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.13.4"
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      # `chat` is not optional here: luxe's mission is the interactive
      # fallback front-end, and without textual/prompt_toolkit the whole TUI
      # module import-skips — 26 tests silently not run.
      # luxe's grep tool shells out to ripgrep; without it three grep tests
      # fail (FileNotFoundError: 'rg') and main has been red since at least
      # 59b9f18. Every fleet host has rg (brew), so the runner should too.
      # qpdf + poppler-utils (pdftotext/pdftoppm) are the CLI half of the
      # [pdf] module; tests/test_mcp_pdf.py skips its qpdf/poppler cases
      # without them.
      - name: Install ripgrep, qpdf, poppler
        run: sudo apt-get update -q && sudo apt-get install -y -q ripgrep qpdf poppler-utils

      # The canonical host sync (chat+dev+analyzers+web, `luxe update` in
      # src/luxe/cli/kit.py) plus [pdf]. Before this, CI ran chat+dev only:
      # tests/test_mcp_pdf.py (53 tests) import-skipped here and on every
      # host, and the real-bandit test skipped. [web] installs playwright but
      # no browser download; tests/test_web_browser_live.py runs on the
      # runner's preinstalled Google Chrome and skips where there is none.
      - name: Sync dependencies
        run: uv sync --extra dev --extra chat --extra analyzers --extra web --extra pdf

      # No `-x`: stopping at the first failure hides the rest of the suite,
      # which is the opposite of what a CI report is for. The live_model
      # tests deselect via the marker filter in pyproject (HS-001) — MLX is
      # Apple-silicon only and cannot install on this runner.
      - name: Run pytest
        run: uv run pytest -q --tb=short
